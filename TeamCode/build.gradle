apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.2.4"
    }
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    sourceSets {
        main {
            java {
                // Comment this line when using Panels instead of FTC Dashboard
                // Uncomment this line when using FTC Dashboard instead of Panels
                // exclude '**/pedroPathing/panels/**'

                // Comment this line when using FTC Dashboard instead of Panels
                // Uncomment this line when using Panels instead of FTC Dashboard
                exclude '**/pedroPathing/ftcdashboard/**'
            }
        }
    }
}

repositories {
    maven {
        url "https://repo.dairy.foundation/releases"
    }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation "org.solverslib:core:0.3.4"
    implementation "org.solverslib:pedroPathing:0.3.4"
    // implementation "org.solverslib:photon:0.3.4"

    // sloth
    implementation("dev.frozenmilk.sinister:Sloth:0.2.4")
//    implementation("com.acmerobotics.slothboard:dashboard:0.2.4+0.5.1")
    implementation "com.bylazar.sloth:fullpanels:0.2.4+1.0.12"

    implementation 'org.psilynx.psikit:core:0.2.0'
    implementation 'org.psilynx.psikit:ftc:0.2.0'
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.firstinspires.ftc:RobotCore:12.0.0'
        force 'org.firstinspires.ftc:Hardware:12.0.0'
        force 'org.firstinspires.ftc:FtcCommon:12.0.0'
    }
}
